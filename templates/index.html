<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ing. MOJICA - Tutor de Programación IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: "Inter", sans-serif; background: #0a1929; min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #ffffff; }
        .app-container { width: 380px; height: 720px; background: #0a1929; border: 1px solid #1e3a5f; border-radius: 30px; position: relative; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        .header { text-align: center; padding: 20px 20px 10px; flex-shrink: 0; }
        .logo { font-size: 18px; font-weight: 700; color: #64b5f6; margin-bottom: 15px; }
        .profile { text-align: center; position: relative; }
        .avatar-container { width: 90px; height: 90px; margin: 0 auto 10px; position: relative; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #64b5f6; background: linear-gradient(135deg, #1e3a5f 0%, #0a1929 100%); display: flex; align-items: center; justify-content: center; font-size: 48px; position: relative; z-index: 2; }
        .online-badge { position: absolute; top: 5px; right: 5px; background: #4caf50; color: #fff; font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 8px; z-index: 3; border: 2px solid #0a1929; }
        .teacher-name { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
        .teacher-title { font-size: 12px; color: #90caf9; margin-bottom: 8px; }
        .level-badge { display: inline-block; background: #1e3a5f; color: #64b5f6; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .messages { flex: 1; overflow-y: auto; padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }
        .message { padding: 10px 14px; border-radius: 18px; max-width: 80%; word-wrap: break-word; font-size: 14px; line-height: 1.4; position: relative; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .message.bot { background: #1e3a5f; color: #ffffff; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.user { background: #1976d2; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message .speak-btn { position: absolute; right: -28px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; font-size: 14px; opacity: 0.6; transition: opacity 0.2s; }
        .message .speak-btn:hover { opacity: 1; }
        .buttons-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; align-self: flex-start; max-width: 90%; }
        .option-btn { background: #1976d2; color: #fff; border: none; padding: 8px 14px; border-radius: 16px; font-size: 12px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .option-btn:hover { background: #1565c0; }
        .option-btn.disabled { opacity: 0.5; cursor: not-allowed; }
        .input-area { padding: 15px 20px; background: #0a1929; border-top: 1px solid #1e3a5f; display: flex; gap: 8px; flex-shrink: 0; }
        .input-area input { flex: 1; background: #1e3a5f; border: 1px solid #2c5282; border-radius: 20px; padding: 10px 16px; color: #fff; font-size: 14px; outline: none; }
        .input-area input::placeholder { color: #90caf9; }
        .input-area button { background: #1976d2; border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .input-area button:hover { background: #1565c0; }
        .typing { display: inline-flex; gap: 3px; padding: 10px 14px; }
        .typing span { width: 6px; height: 6px; background: #90caf9; border-radius: 50%; animation: bounce 0.6s infinite ease-in-out; }
        .typing span:nth-child(2) { animation-delay: 0.1s; }
        .typing span:nth-child(3) { animation-delay: 0.2s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        .mode-indicator { background: #1e3a5f; padding: 6px 12px; border-radius: 12px; font-size: 11px; color: #64b5f6; display: inline-block; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">CodeAI Tutor</div>
            <div class="profile">
                <div class="avatar-container">
                    <div class="avatar"><img src="{{ url_for('static', filename='profe.png') }}" alt="Ing. MOJICA" style="width:100%;height:100%;border-radius:50%;object-fit:cover;"></div>
                    <div class="online-badge">ONLINE</div>
                </div>
                <div class="teacher-name">Ing. MOJICA</div>
                <div class="teacher-title">Su Profe de Programación</div>
                <div class="level-badge" id="levelBadge">Nivel: INICIO</div>
            </div>
        </div>
        <div class="messages" id="chatMessages"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escribe tu pregunta de programación..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>
    <script>
        const messagesEl = document.getElementById("chatMessages");
        const inputEl = document.getElementById("userInput");
        const levelBadge = document.getElementById("levelBadge");
        let currentAudio = null;
        let isProcessing = false;

        inputEl.addEventListener("keypress", (e) => { if (e.key === "Enter" && !isProcessing) sendMessage(); });

        // Stream de respuesta del LLM usando SSE. Muestra cada fragmento al llegar.
        async function streamBotResponse(text) {
            hideTyping();
            // Crear el contenedor del mensaje con un span para el texto y
            // otro span con la animacion de typing (3 puntitos que rebotan,
            // misma clase .typing usada en showTyping()). El span de typing
            // se muestra mientras no llegue el primer token real del LLM,
            // dando la sensacion de que el profesor esta escribiendo.
            const msg = document.createElement("div");
            msg.className = "message bot streaming";
            const typingDots = document.createElement("span");
            typingDots.className = "typing";
            typingDots.innerHTML = "<span></span><span></span><span></span>";
            const span = document.createElement("span");
            span.className = "bot-text";
            span.textContent = "";
            msg.appendChild(typingDots);
            msg.appendChild(span);
            const speakBtn = document.createElement("button");
            speakBtn.className = "speak-btn";
            speakBtn.textContent = "🔊";
            msg.appendChild(speakBtn);
            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            let firstTokenSeen = false;
            let fullText = "";
            // Timeout global: si el stream no termina en 60s (o no llega
            // ningun token en 15s), lo abortamos y mostramos un mensaje
            // de error. Esto evita que el usuario vea la respuesta
            // "congelada para siempre" si el LLM se queda colgado.
            let streamAborted = false;
            const STREAM_TIMEOUT_MS = 60000;
            const FIRST_TOKEN_TIMEOUT_MS = 15000;
            const streamTimer = setTimeout(() => {
                streamAborted = true;
                if (typingDots.parentNode) typingDots.remove();
                span.textContent = "Disculpa, la respuesta tardó demasiado. Por favor, inténtalo de nuevo.";
                console.warn("Stream timeout global");
            }, STREAM_TIMEOUT_MS);
            const firstTokenTimer = setTimeout(() => {
                if (!firstTokenSeen) {
                    if (typingDots.parentNode) typingDots.remove();
                    span.textContent = "Disculpa, el profesor está tardando en responder. Inténtalo de nuevo.";
                    console.warn("First token timeout");
                }
            }, FIRST_TOKEN_TIMEOUT_MS);
            try {
                const res = await fetch("/api/chat/stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                if (!res.ok || !res.body) {
                    throw new Error("Stream no disponible");
                }
                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                // Cuando llega un chunk grande (ej. 200 chars de golpe), lo
                // animamos letra por letra para que la escritura se sienta
                // fluida y no aparezca "todo de una".
                const animateDelta = (delta) => {
                    if (!firstTokenSeen) {
                        firstTokenSeen = true;
                        if (typingDots.parentNode) typingDots.remove();
                        // Limpiar el timeout del primer token: ya llego el primero.
                        clearTimeout(firstTokenTimer);
                    }
                    // Para chunks pequenos (<=6 chars) los pintamos directo.
                    // Para chunks grandes, los partimos en grupos de 3-5 chars
                    // y los pintamos con un pequeño delay entre cada grupo.
                    const CHUNK_SIZE = 4;
                    if (delta.length <= CHUNK_SIZE) {
                        fullText += delta;
                        span.textContent = fullText;
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                        return;
                    }
                    // Animar progresivamente con requestAnimationFrame para
                    // que se vea como escritura natural.
                    let i = 0;
                    const step = () => {
                        if (i >= delta.length) return;
                        const slice = delta.slice(i, i + CHUNK_SIZE);
                        fullText += slice;
                        span.textContent = fullText;
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                        i += CHUNK_SIZE;
                        // ~16ms entre cada grupo = ~60fps, suficiente para
                        // que el usuario vea la animacion de escribir.
                        setTimeout(step, 18);
                    };
                    step();
                };
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    // Procesar eventos SSE: separar por \n\n
                    const events = buffer.split(/\r?\n\r?\n/);
                    // El ultimo elemento puede ser un evento parcial (sin \n\n final).
                    // Lo dejamos en el buffer para concatenarlo con el siguiente chunk.
                    buffer = events.pop() || "";
                    for (const evt of events) {
                        // Ignorar comentarios SSE (keepalive: ": keepalive")
                        if (!evt.trim() || evt.startsWith(":")) continue;
                        const line = evt.split(/\r?\n/).find(l => l.startsWith("data: "));
                        if (!line) continue;
                        const payload = line.slice(6).trim();
                        if (!payload) continue;
                        try {
                            const obj = JSON.parse(payload);
                            if (obj.event === "token" && obj.delta) {
                                animateDelta(obj.delta);
                            } else if (obj.event === "done") {
                                firstTokenSeen = true;
                                if (typingDots.parentNode) typingDots.remove();
                                // Stream completo: limpiar todos los timers.
                                clearTimeout(streamTimer);
                                clearTimeout(firstTokenTimer);
                                fullText = obj.text || fullText;
                                span.textContent = fullText;
                                // Renderizar botones del paso (niveles, modos, acciones rapidas)
                                if (obj.botones && obj.botones.length) {
                                    const cont = document.createElement("div");
                                    cont.className = "buttons-container";
                                    obj.botones.forEach(b => {
                                        const btn = document.createElement("button");
                                        btn.className = "option-btn";
                                        btn.textContent = b.texto;
                                        btn.title = b.descripcion || "";
                                        // Si es un nivel valido, guardarlo para el badge
                                        const nivelesValidos = ["INICIO","NOVATO","APRENDIZ","TECNICO","TECNOLOGO","INGENIERO","INGENIERO_IA","JUNIOR","SENIOR","CONSULTOR","ANALISTA_DATOS","DBA","CALIDAD"];
                                        if (nivelesValidos.includes(b.valor)) {
                                            sessionStorage.setItem("nivel", b.valor);
                                        }
                                        btn.onclick = () => { sendAction(b.valor, b.texto); disableBtns(cont); };
                                        cont.appendChild(btn);
                                    });
                                    msg.parentNode.insertBefore(cont, msg.nextSibling);
                                    messagesEl.scrollTop = messagesEl.scrollHeight;
                                }
                                if (obj.paso) updateLevelBadge(obj.paso);
                            } else if (obj.error) {
                                if (typingDots.parentNode) typingDots.remove();
                                clearTimeout(streamTimer);
                                clearTimeout(firstTokenTimer);
                                span.textContent = "Error: " + obj.error;
                            }
                        } catch (e) {
                            // ignore parse errors
                        }
                    }
                }
                // Configurar speakBtn con el texto completo al final
                speakBtn.onclick = () => speakText(fullText);
                msg.classList.remove("streaming");
            } catch (e) {
                // Si el streaming falla, fallback al endpoint clasico
                try {
                    const r2 = await fetch("/api/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text })
                    });
                    const d2 = await r2.json();
                    if (typingDots.parentNode) typingDots.remove();
                    clearTimeout(streamTimer);
                    clearTimeout(firstTokenTimer);
                    span.textContent = d2.message || "";
                    fullText = d2.message || "";
                    speakBtn.onclick = () => speakText(fullText);
                    if (d2.paso) updateLevelBadge(d2.paso);
                } catch (e2) {
                    if (typingDots.parentNode) typingDots.remove();
                    clearTimeout(streamTimer);
                    clearTimeout(firstTokenTimer);
                    span.textContent = "Error de conexión. Por favor, inténtalo de nuevo.";
                }
            } finally {
                // Limpiar el typingDots si por alguna razon quedo visible
                if (typingDots.parentNode) typingDots.remove();
                clearTimeout(streamTimer);
                clearTimeout(firstTokenTimer);
            }
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isProcessing) return;
            isProcessing = true;
            inputEl.value = "";
            addMessage(text, "user");
            showTyping();
            // Usar streaming SIEMPRE: la primera respuesta es mas rapida y casi inmediata.
            await streamBotResponse(text);
            isProcessing = false;
        }

        async function sendAction(action, texto) {
            if (isProcessing) return;
            isProcessing = true;
            addMessage(texto, "user");
            showTyping();
            // Si el usuario selecciona un nivel, lo guardamos localmente para el badge
            const nivelesValidos = ["INICIO","NOVATO","APRENDIZ","TECNICO","TECNOLOGO","INGENIERO","INGENIERO_IA","JUNIOR","SENIOR","CONSULTOR","ANALISTA_DATOS","DBA","CALIDAD"];
            if (nivelesValidos.includes(action)) {
                sessionStorage.setItem("nivel", action);
            }
            try {
                const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: action }) });
                const data = await res.json();
                hideTyping();
                if (data.message) addMessage(data.message, "bot", data.botones);
                if (data.paso) updateLevelBadge(data.paso);
            } catch (e) {
                hideTyping();
                addMessage("Disculpa, ocurrió un error. Inténtalo de nuevo.", "bot");
            }
            isProcessing = false;
        }

        function addMessage(text, sender, botones) {
            const msg = document.createElement("div");
            msg.className = `message ${sender}`;
            const span = document.createElement("span");
            span.textContent = text;
            msg.appendChild(span);
            if (sender === "bot") {
                const speakBtn = document.createElement("button");
                speakBtn.className = "speak-btn";
                speakBtn.textContent = "🔊";
                speakBtn.onclick = () => speakText(text);
                msg.appendChild(speakBtn);
            }
            messagesEl.appendChild(msg);
            if (botones && botones.length && sender === "bot") {
                const cont = document.createElement("div");
                cont.className = "buttons-container";
                botones.forEach(b => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.textContent = b.texto;
                    btn.title = b.descripcion || "";
                    btn.onclick = () => { sendAction(b.valor, b.texto); disableBtns(cont); };
                    cont.appendChild(btn);
                });
                messagesEl.appendChild(cont);
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function disableBtns(c) { c.querySelectorAll(".option-btn").forEach(b => b.classList.add("disabled")); }

        function showTyping() {
            const t = document.createElement("div");
            t.className = "message bot typing";
            t.id = "typingIndicator";
            t.innerHTML = "<span></span><span></span><span></span>";
            messagesEl.appendChild(t);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideTyping() { const t = document.getElementById("typingIndicator"); if (t) t.remove(); }

        async function speakText(text) {
            try {
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                const res = await fetch("/api/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: text }) });
                const data = await res.json();
                if (data.useBrowserTTS) {
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = "en-US";
                    window.speechSynthesis.speak(u);
                } else if (data.audioUrl) {
                    const audio = new Audio(data.audioUrl);
                    currentAudio = audio;
                    audio.play();
                }
            } catch (e) { console.error("TTS error:", e); }
        }

        function updateLevelBadge(paso) {
            if (paso === "in_session") {
                const nivel = sessionStorage.getItem("nivel") || "INICIO";
                levelBadge.textContent = `Nivel: ${nivel}`;
            }
        }

        // Iniciar conversacin al cargar
        window.addEventListener("load", () => { sendAction("init", ""); });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ing. MOJICA - Tutor de Programación IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: "Inter", sans-serif; background: #0a1929; min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #ffffff; }
        .app-container { width: 380px; height: 720px; background: #0a1929; border: 1px solid #1e3a5f; border-radius: 30px; position: relative; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        .header { text-align: center; padding: 20px 20px 10px; flex-shrink: 0; }
        .logo { font-size: 18px; font-weight: 700; color: #64b5f6; margin-bottom: 15px; }
        .profile { text-align: center; position: relative; }
        .avatar-container { width: 90px; height: 90px; margin: 0 auto 10px; position: relative; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #64b5f6; background: linear-gradient(135deg, #1e3a5f 0%, #0a1929 100%); display: flex; align-items: center; justify-content: center; font-size: 48px; position: relative; z-index: 2; }
        .online-badge { position: absolute; top: 5px; right: 5px; background: #4caf50; color: #fff; font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 8px; z-index: 3; border: 2px solid #0a1929; }
        .teacher-name { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
        .teacher-title { font-size: 12px; color: #90caf9; margin-bottom: 8px; }
        .level-badge { display: inline-block; background: #1e3a5f; color: #64b5f6; padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .messages { flex: 1; overflow-y: auto; padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }
        .message { padding: 10px 14px; border-radius: 18px; max-width: 80%; word-wrap: break-word; font-size: 14px; line-height: 1.4; position: relative; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .message.bot { background: #1e3a5f; color: #ffffff; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.user { background: #1976d2; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message .speak-btn { position: absolute; right: -34px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; font-size: 22px; opacity: 0.85; transition: opacity 0.2s, transform 0.15s; filter: drop-shadow(0 0 1px rgba(0,0,0,0.4)); }
        .message .speak-btn:hover { opacity: 1; transform: translateY(-50%) scale(1.15); }
        .message .speak-btn.playing { color: #1976d2; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%, 100% { transform: translateY(-50%) scale(1); } 50% { transform: translateY(-50%) scale(1.2); } }
        .code-block { background: #0d1b2a; border: 1px solid #1e3a5f; border-radius: 10px; padding: 12px 14px; margin: 8px 0; font-family: "Fira Code", "Consolas", "Courier New", monospace; font-size: 12.5px; line-height: 1.5; color: #e3f2fd; overflow-x: auto; white-space: pre; max-height: 300px; overflow-y: auto; position: relative; }
        .code-block::-webkit-scrollbar { height: 6px; width: 6px; }
        .code-block::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 3px; }
        .code-block-lang { position: absolute; top: 6px; right: 8px; font-size: 10px; color: #64b5f6; font-weight: 600; text-transform: uppercase; opacity: 0.7; font-family: "Inter", sans-serif; }
        .bot-text { white-space: pre-wrap; word-wrap: break-word; }
        .bot-text p { margin: 6px 0; }
        .bot-text strong { font-weight: 700; color: #90caf9; }
        .bot-text em { font-style: italic; color: #bbdefb; }
        .bot-text code { background: #1e3a5f; padding: 1px 5px; border-radius: 4px; font-family: "Fira Code", "Consolas", monospace; font-size: 12px; color: #ffe082; }
        .bot-text ul, .bot-text ol { margin: 6px 0 6px 20px; }
        .bot-text li { margin: 3px 0; }
        .voice-toggle { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 4px 10px; font-size: 10px; color: #90caf9; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: "Inter", sans-serif; z-index: 5; transition: background 0.2s; }
        .voice-toggle:hover { background: rgba(255,255,255,0.1); }
        .voice-toggle.muted { color: #607d8b; }
        .buttons-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; align-self: flex-start; max-width: 90%; }
        .option-btn { background: #1976d2; color: #fff; border: none; padding: 8px 14px; border-radius: 16px; font-size: 12px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .option-btn:hover { background: #1565c0; }
        .option-btn.disabled { opacity: 0.5; cursor: not-allowed; }
        .input-area { padding: 15px 20px; background: #0a1929; border-top: 1px solid #1e3a5f; display: flex; gap: 8px; flex-shrink: 0; }
        .input-area input { flex: 1; background: #1e3a5f; border: 1px solid #2c5282; border-radius: 20px; padding: 10px 16px; color: #fff; font-size: 14px; outline: none; }
        .input-area input::placeholder { color: #90caf9; }
        .input-area button { background: #1976d2; border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .input-area button:hover { background: #1565c0; }
        .typing { display: inline-flex; gap: 3px; padding: 10px 14px; }
        .typing span { width: 6px; height: 6px; background: #90caf9; border-radius: 50%; animation: bounce 0.6s infinite ease-in-out; }
        .typing span:nth-child(2) { animation-delay: 0.1s; }
        .typing span:nth-child(3) { animation-delay: 0.2s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        .mode-indicator { background: #1e3a5f; padding: 6px 12px; border-radius: 12px; font-size: 11px; color: #64b5f6; display: inline-block; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">CodeAI Tutor</div>
            <button id="voiceToggle" class="voice-toggle" title="Activar/Desactivar voz automática">🔊 Voz ON</button>
            <div class="profile">
                <div class="avatar-container">
                    <div class="avatar"><img src="{{ url_for('static', filename='profe.png') }}" alt="Ing. MOJICA" style="width:100%;height:100%;border-radius:50%;object-fit:cover;"></div>
                    <div class="online-badge">ONLINE</div>
                </div>
                <div class="teacher-name">Ing. MOJICA</div>
                <div class="teacher-title">Su Profe de Programación</div>
                <div class="level-badge" id="levelBadge">Nivel: INICIO</div>
            </div>
        </div>
        <div class="messages" id="chatMessages"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escribe tu pregunta de programación..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>
    <script>
        const messagesEl = document.getElementById("chatMessages");
        const inputEl = document.getElementById("userInput");
        const levelBadge = document.getElementById("levelBadge");
        const voiceToggleBtn = document.getElementById("voiceToggle");
        let currentAudio = null;
        let isProcessing = false;
        // Voz automatica ON por defecto. El usuario puede desactivarla
        // haciendo click en el toggle del header.
        let voiceEnabled = true;

        // Toggle de voz automatica
        voiceToggleBtn.addEventListener("click", () => {
            voiceEnabled = !voiceEnabled;
            voiceToggleBtn.textContent = voiceEnabled ? "🔊 Voz ON" : "🔇 Voz OFF";
            voiceToggleBtn.classList.toggle("muted", !voiceEnabled);
            if (!voiceEnabled && currentAudio) {
                // Si desactivamos la voz mientras hay audio sonando, lo paramos.
                currentAudio.pause();
                currentAudio = null;
                // Tambien quitar cualquier TTS del navegador en cola
                if (window.speechSynthesis) window.speechSynthesis.cancel();
            }
        });

        inputEl.addEventListener("keypress", (e) => { if (e.key === "Enter" && !isProcessing) sendMessage(); });

        // ── Renderizado de markdown + exclusion de codigo para TTS ──
        // Esta funcion recibe el texto completo del LLM (con markdown),
        // y devuelve:
        //   - container: un <div> con el HTML listo para mostrar bonito
        //     (bloques de codigo en <pre><code>, negritas en <strong>, etc.)
        //   - speakText: el texto SIN codigo, listo para enviar a /api/speak.
        //     El codigo se reemplaza por "Aqui va un ejemplo de codigo."
        //     para que el avatar sepa que NO debe leerlo, solo mencionarlo.
        function renderMarkdown(rawText) {
            const container = document.createElement("div");
            container.className = "bot-text";
            // speakText acumula solo lo que NO es codigo
            let speakText = "";
            // Split por bloques de codigo (```lenguaje\ncodigo\n```)
            // usando una regex que captura el bloque entero.
            const codeBlockRegex = /```(\w*)\n?([\s\S]*?)```/g;
            let lastIndex = 0;
            let match;
            while ((match = codeBlockRegex.exec(rawText)) !== null) {
                // Texto antes del bloque de codigo
                const before = rawText.slice(lastIndex, match.index);
                if (before) {
                    const inlineHtml = formatInlineMarkdown(before);
                    container.insertAdjacentHTML("beforeend", inlineHtml);
                    speakText += stripMarkdown(before) + " ";
                }
                // Bloque de codigo: lo renderizamos como <pre><code>
                const lang = match[1] || "";
                const code = match[2] || "";
                const pre = document.createElement("pre");
                pre.className = "code-block";
                // Etiqueta de lenguaje arriba a la derecha
                if (lang) {
                    const langLabel = document.createElement("span");
                    langLabel.className = "code-block-lang";
                    langLabel.textContent = lang;
                    pre.appendChild(langLabel);
                }
                const codeEl = document.createElement("code");
                codeEl.textContent = code;
                pre.appendChild(codeEl);
                container.appendChild(pre);
                // Para TTS: NO leemos el codigo, solo anunciamos que hay uno.
                speakText += "Aquí va un ejemplo de código. ";
                lastIndex = match.index + match[0].length;
            }
            // Resto del texto despues del ultimo bloque de codigo
            const tail = rawText.slice(lastIndex);
            if (tail) {
                container.insertAdjacentHTML("beforeend", formatInlineMarkdown(tail));
                speakText += stripMarkdown(tail);
            }
            return { container, speakText: speakText.trim() };
        }

        // Markdown inline (sin bloques de codigo): negritas, cursivas,
        // codigo en linea, listas simples.
        function formatInlineMarkdown(text) {
            // Escapar HTML primero para evitar XSS
            let s = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            // Codigo en linea: `x` -> <code>x</code>
            s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
            // Negritas: **x** -> <strong>x</strong>
            s = s.replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>");
            // Cursivas: *x* -> <em>x</em> (cuidando no romper guiones bajos)
            s = s.replace(/(?<![A-Za-z0-9_])\*([^*\n]+?)\*(?![A-Za-z0-9_])/g, "<em>$1</em>");
            // Listas simples: lineas que empiezan con "- " o "* "
            s = s.replace(/(^|\n)[-*]\s+(.+)/g, "$1<li>$2</li>");
            s = s.replace(/(<li>.*<\/li>)/s, "<ul>$1</ul>");
            // Saltos de linea -> <br>
            s = s.replace(/\n/g, "<br>");
            return s;
        }

        // Para TTS: quitar todo el markdown y dejar texto natural.
        function stripMarkdown(text) {
            let s = text;
            s = s.replace(/`([^`]+)`/g, "$1");
            s = s.replace(/\*\*([^*\n]+?)\*\*/g, "$1");
            s = s.replace(/(?<![A-Za-z0-9_])\*([^*\n]+?)\*(?![A-Za-z0-9_])/g, "$1");
            s = s.replace(/^\s*[-*]\s+/gm, "");
            s = s.replace(/\n/g, " ");
            s = s.replace(/\s+/g, " ");
            return s.trim();
        }

        // Stream de respuesta del LLM usando SSE. Muestra cada fragmento al llegar.
        async function streamBotResponse(text) {
            hideTyping();
            // Crear el contenedor del mensaje con un span para el texto y
            // otro span con la animacion de typing (3 puntitos que rebotan,
            // misma clase .typing usada en showTyping()). El span de typing
            // se muestra mientras no llegue el primer token real del LLM,
            // dando la sensacion de que el profesor esta escribiendo.
            const msg = document.createElement("div");
            msg.className = "message bot streaming";
            const typingDots = document.createElement("span");
            typingDots.className = "typing";
            typingDots.innerHTML = "<span></span><span></span><span></span>";
            // El contenedor del texto se reemplaza entero en cada render
            // para que el markdown (codigo, negritas, etc.) se vea bonito.
            const textContainer = document.createElement("div");
            textContainer.className = "bot-text";
            msg.appendChild(typingDots);
            msg.appendChild(textContainer);
            const speakBtn = document.createElement("button");
            speakBtn.className = "speak-btn";
            speakBtn.textContent = "🔊";
            msg.appendChild(speakBtn);
            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            let firstTokenSeen = false;
            let fullText = "";        // markdown crudo del LLM
            let speakOnlyText = "";   // texto limpio para TTS (sin codigo)
            // Re-renderizador con throttling: no queremos re-renderizar el
            // markdown completo en cada token (seria lento). Usamos un
            // microtask para aplazar al final del tick.
            let renderScheduled = false;
            const scheduleRender = () => {
                if (renderScheduled) return;
                renderScheduled = true;
                queueMicrotask(() => {
                    renderScheduled = false;
                    const { container, speakText } = renderMarkdown(fullText);
                    textContainer.innerHTML = "";
                    // Mover todos los hijos del container al textContainer
                    while (container.firstChild) {
                        textContainer.appendChild(container.firstChild);
                    }
                    speakOnlyText = speakText;
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                });
            };

            // Funcion que se llama cuando termina el stream (evento done).
            // Aqui configuramos el speakBtn, disparamos auto-play si esta
            // habilitado, y dejamos el contenido listo.
            const finalizeResponse = () => {
                speakBtn.classList.remove("playing");
                speakBtn.textContent = "🔊";
                speakBtn.onclick = () => speakFromBtn(speakBtn);
                // Si la voz automatica esta activa, reproducir inmediatamente.
                if (voiceEnabled && speakOnlyText.trim()) {
                    // Pequeno delay para que el usuario vea el boton "playing"
                    setTimeout(() => speakFromBtn(speakBtn), 250);
                }
            };

            const speakFromBtn = async (btn) => {
                if (!speakOnlyText.trim()) return;
                btn.classList.add("playing");
                btn.textContent = "🔉";
                try {
                    await speakText(speakOnlyText);
                } finally {
                    btn.classList.remove("playing");
                    btn.textContent = "🔊";
                }
            };

            // Timeout global: si el stream no termina en 60s (o no llega
            // ningun token en 15s), lo abortamos y mostramos un mensaje
            // de error. Esto evita que el usuario vea la respuesta
            // "congelada para siempre" si el LLM se queda colgado.
            let streamAborted = false;
            const STREAM_TIMEOUT_MS = 60000;
            const FIRST_TOKEN_TIMEOUT_MS = 15000;
            const streamTimer = setTimeout(() => {
                streamAborted = true;
                if (typingDots.parentNode) typingDots.remove();
                textContainer.textContent = "Disculpa, la respuesta tardó demasiado. Por favor, inténtalo de nuevo.";
                console.warn("Stream timeout global");
            }, STREAM_TIMEOUT_MS);
            const firstTokenTimer = setTimeout(() => {
                if (!firstTokenSeen) {
                    if (typingDots.parentNode) typingDots.remove();
                    textContainer.textContent = "Disculpa, el profesor está tardando en responder. Inténtalo de nuevo.";
                    console.warn("First token timeout");
                }
            }, FIRST_TOKEN_TIMEOUT_MS);
            try {
                const res = await fetch("/api/chat/stream", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                if (!res.ok || !res.body) {
                    throw new Error("Stream no disponible");
                }
                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                // Acumulamos el delta al texto crudo y dejamos que
                // scheduleRender() haga el trabajo de re-renderizar el
                // markdown con throttling (microtask).
                const animateDelta = (delta) => {
                    if (!firstTokenSeen) {
                        firstTokenSeen = true;
                        if (typingDots.parentNode) typingDots.remove();
                        // Limpiar el timeout del primer token: ya llego el primero.
                        clearTimeout(firstTokenTimer);
                    }
                    fullText += delta;
                    scheduleRender();
                };
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    // Procesar eventos SSE: separar por \n\n
                    const events = buffer.split(/\r?\n\r?\n/);
                    // El ultimo elemento puede ser un evento parcial (sin \n\n final).
                    // Lo dejamos en el buffer para concatenarlo con el siguiente chunk.
                    buffer = events.pop() || "";
                    for (const evt of events) {
                        // Ignorar comentarios SSE (keepalive: ": keepalive")
                        if (!evt.trim() || evt.startsWith(":")) continue;
                        const line = evt.split(/\r?\n/).find(l => l.startsWith("data: "));
                        if (!line) continue;
                        const payload = line.slice(6).trim();
                        if (!payload) continue;
                        try {
                            const obj = JSON.parse(payload);
                            if (obj.event === "token" && obj.delta) {
                                animateDelta(obj.delta);
                            } else if (obj.event === "done") {
                                firstTokenSeen = true;
                                if (typingDots.parentNode) typingDots.remove();
                                // Stream completo: limpiar todos los timers.
                                clearTimeout(streamTimer);
                                clearTimeout(firstTokenTimer);
                                fullText = obj.text || fullText;
                                scheduleRender();
                                // Renderizar botones del paso (niveles, modos, acciones rapidas)
                                if (obj.botones && obj.botones.length) {
                                    const cont = document.createElement("div");
                                    cont.className = "buttons-container";
                                    obj.botones.forEach(b => {
                                        const btn = document.createElement("button");
                                        btn.className = "option-btn";
                                        btn.textContent = b.texto;
                                        btn.title = b.descripcion || "";
                                        // Si es un nivel valido, guardarlo para el badge
                                        const nivelesValidos = ["INICIO","NOVATO","APRENDIZ","TECNICO","TECNOLOGO","INGENIERO","INGENIERO_IA","JUNIOR","SENIOR","CONSULTOR","ANALISTA_DATOS","DBA","CALIDAD"];
                                        if (nivelesValidos.includes(b.valor)) {
                                            sessionStorage.setItem("nivel", b.valor);
                                        }
                                        btn.onclick = () => { sendAction(b.valor, b.texto); disableBtns(cont); };
                                        cont.appendChild(btn);
                                    });
                                    msg.parentNode.insertBefore(cont, msg.nextSibling);
                                    messagesEl.scrollTop = messagesEl.scrollHeight;
                                }
                                if (obj.paso) updateLevelBadge(obj.paso);
                                scheduleRender();
                                finalizeResponse();
                            } else if (obj.error) {
                                if (typingDots.parentNode) typingDots.remove();
                                clearTimeout(streamTimer);
                                clearTimeout(firstTokenTimer);
                                textContainer.textContent = "Error: " + obj.error;
                            }
                        } catch (e) {
                            // ignore parse errors
                        }
                    }
                }
                msg.classList.remove("streaming");
            } catch (e) {
                // Si el streaming falla, fallback al endpoint clasico
                try {
                    const r2 = await fetch("/api/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text })
                    });
                    const d2 = await r2.json();
                    if (typingDots.parentNode) typingDots.remove();
                    clearTimeout(streamTimer);
                    clearTimeout(firstTokenTimer);
                    fullText = d2.message || "";
                    scheduleRender();
                    if (d2.paso) updateLevelBadge(d2.paso);
                    finalizeResponse();
                } catch (e2) {
                    if (typingDots.parentNode) typingDots.remove();
                    clearTimeout(streamTimer);
                    clearTimeout(firstTokenTimer);
                    textContainer.textContent = "Error de conexión. Por favor, inténtalo de nuevo.";
                }
            } finally {
                // Limpiar el typingDots si por alguna razon quedo visible
                if (typingDots.parentNode) typingDots.remove();
                clearTimeout(streamTimer);
                clearTimeout(firstTokenTimer);
            }
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || isProcessing) return;
            isProcessing = true;
            inputEl.value = "";
            addMessage(text, "user");
            showTyping();
            // Usar streaming SIEMPRE: la primera respuesta es mas rapida y casi inmediata.
            await streamBotResponse(text);
            isProcessing = false;
        }

        async function sendAction(action, texto) {
            if (isProcessing) return;
            isProcessing = true;
            addMessage(texto, "user");
            showTyping();
            // Si el usuario selecciona un nivel, lo guardamos localmente para el badge
            const nivelesValidos = ["INICIO","NOVATO","APRENDIZ","TECNICO","TECNOLOGO","INGENIERO","INGENIERO_IA","JUNIOR","SENIOR","CONSULTOR","ANALISTA_DATOS","DBA","CALIDAD"];
            if (nivelesValidos.includes(action)) {
                sessionStorage.setItem("nivel", action);
            }
            try {
                const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: action }) });
                const data = await res.json();
                hideTyping();
                if (data.message) addMessage(data.message, "bot", data.botones);
                if (data.paso) updateLevelBadge(data.paso);
            } catch (e) {
                hideTyping();
                addMessage("Disculpa, ocurrió un error. Inténtalo de nuevo.", "bot");
            }
            isProcessing = false;
        }

        function addMessage(text, sender, botones) {
            const msg = document.createElement("div");
            msg.className = `message ${sender}`;
            // Para el bot renderizamos markdown (codigo, negritas, etc.)
            // Para el user lo dejamos como texto plano.
            if (sender === "bot") {
                const { container, speakText: clean } = renderMarkdown(text || "");
                msg.appendChild(container);
                const speakBtn = document.createElement("button");
                speakBtn.className = "speak-btn";
                speakBtn.textContent = "🔊";
                speakBtn.onclick = () => {
                    speakBtn.classList.add("playing");
                    speakBtn.textContent = "🔉";
                    speakText(clean).finally(() => {
                        speakBtn.classList.remove("playing");
                        speakBtn.textContent = "🔊";
                    });
                };
                msg.appendChild(speakBtn);
                // Auto-play si la voz esta activa
                if (voiceEnabled && clean.trim()) {
                    setTimeout(() => speakBtn.click(), 250);
                }
            } else {
                const span = document.createElement("span");
                span.textContent = text || "";
                msg.appendChild(span);
            }
            messagesEl.appendChild(msg);
            if (botones && botones.length && sender === "bot") {
                const cont = document.createElement("div");
                cont.className = "buttons-container";
                botones.forEach(b => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.textContent = b.texto;
                    btn.title = b.descripcion || "";
                    btn.onclick = () => { sendAction(b.valor, b.texto); disableBtns(cont); };
                    cont.appendChild(btn);
                });
                messagesEl.appendChild(cont);
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function disableBtns(c) { c.querySelectorAll(".option-btn").forEach(b => b.classList.add("disabled")); }

        function showTyping() {
            const t = document.createElement("div");
            t.className = "message bot typing";
            t.id = "typingIndicator";
            t.innerHTML = "<span></span><span></span><span></span>";
            messagesEl.appendChild(t);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideTyping() { const t = document.getElementById("typingIndicator"); if (t) t.remove(); }

        async function speakText(text) {
            try {
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                const res = await fetch("/api/speak", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: text }) });
                const data = await res.json();
                if (data.useBrowserTTS) {
                    // Fallback del navegador: usar el texto limpio que
                    // devuelve el backend (sin markdown/emojis).
                    const u = new SpeechSynthesisUtterance(data.text || text);
                    u.lang = "es-ES";
                    u.rate = 1.1;
                    window.speechSynthesis.speak(u);
                } else if (data.audioUrl) {
                    const audio = new Audio(data.audioUrl);
                    currentAudio = audio;
                    audio.play();
                }
            } catch (e) { console.error("TTS error:", e); }
        }

        function updateLevelBadge(paso) {
            if (paso === "in_session") {
                const nivel = sessionStorage.getItem("nivel") || "INICIO";
                levelBadge.textContent = `Nivel: ${nivel}`;
            }
        }

        // Iniciar conversacin al cargar
        window.addEventListener("load", () => { sendAction("init", ""); });
    </script>
</body>
</html>
